[project]
name = "juger-vite-bloquer-juste"
version = "0.1.0"
description = "Agent mail DeepAgents + Claude, protégé par Jev (TypeSafe)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deepagents==0.7.32",
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langchain-anthropic==1.7.6",
    "langgraph==1.2.17",
    "langchain-typesafe[experimental]==0.0.1a3",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sse-starlette==3.6.0",
    "pydantic-settings==2.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
